坐标为负。", "D 为 BC 的中点，所以 D((b−u)/2,v/2)。由勾股定理，AD²＝[(b−u)²＋v²]/4，DB²＝[(b＋u)²＋v²]/4。", "于是 DB²−AD²＝bu＞0，故 AD＜DB，A 在圆内。"], "hints": ["圆的半径是 DB，真正需要求的是 AD 的大小关系。", "可把钝角 A 放在原点，借助水平、竖直距离比较平方。"], "options": null, "correct": null, "source": "资料·变式 1-2；验证为教学补充", "fig": {"type": "obtuse"}, "core": false}, {"id": "1p3", "title": "变式 1-3 · 高线与中线", "text": "在 Rt△ABC 中，∠ACB＝90°，AC＝6，BC＝8。CP、CM 分别是 AB 边上的高线和中线。以 A 为圆心、4 为半径作圆，判断 P、M 的位置。", "answer": "P 在圆内，M 在圆外。", "steps": ["AB＝√(6²＋8²)＝10。", "用两种方法表示面积：(1/2)AB·CP＝(1/2)AC·BC，得 CP＝48/10＝4.8。", "在 Rt△ACP 中，AP＝√(6²−4.8²)＝3.6。", "M 是 AB 的中点，AM＝5。AP＝3.6＜4，AM＝5＞4。", "因此 P 在圆内，M 在圆外。圆心是 A，不能拿 CP、CM 与半径比较。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "资料·变式 1-3", "fig": {"type": "rtalt"}, "core": false}, {"id": "1p4", "title": "补充 1 · 对角线与中点", "text": "矩形 ABCD 中，AB＝6，BC＝8，对角线交于 O，M 为 AB 中点。以 O 为圆心、OB 为半径作圆，判断 M 的位置。", "answer": "M 在圆内。", "steps": ["矩形对角线长为 √(6²＋8²)＝10，且对角线互相平分，所以 OB＝5。", "O 是矩形中心，OM⊥AB，OM＝BC/2＝4。", "OM＝4＜OB＝5，所以 M 在圆内。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主补充", "fig": {"type": "rectcenter"}, "core": false}, {"id": "1p5", "title": "补充 2 · 同一对角线上的两点", "text": "正方形 ABCD 的边长为 4，M 为 AC 的中点。以 A 为圆心、AD 为半径作圆，判断 C、M 的位置。", "answer": "C 在圆外，M 在圆内。", "steps": ["半径 r＝AD＝4。", "AC＝4√2，AM＝2√2。", "AC²＝32＞r²＝16，AM²＝8＜r²＝16。", "所以 C 在圆外，M 在圆内。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主补充", "fig": {"type": "square"}, "core": false}], "lab": "point"}, {"id": 2, "title": "圆的基本概念辨析", "sub": "抓住定义中的条件，给错误说法找反例。", "rules": [["弦与直径", "连接圆上两个不同点的线段叫作弦。经过圆心的弦是直径。半径的一端是圆心，因此半径本身不是弦。"], ["弧与等弧", "圆上两点之间的部分叫作弧。小于半圆的是劣弧，大于半圆的是优弧。<b>同圆或等圆中<\/b>，能够完全重合的弧叫作等弧。"], ["等圆", "半径相等的两个圆是等圆。等弧一定等长，只有弧长相等，却不一定是等弧。"]], "proof": ["为什么直径是最长的弦？", ["设 AB 是圆的一条弦，连接 OA、OB，两条半径均为 r。", "若 AB 不经过 O，由三角形两边之和大于第三边，AB＜OA＋OB＝2r。", "若 AB 经过 O，AB＝OA＋OB＝2r，它就是直径。", "因此弦长满足 0＜AB≤2r，等号恰好在 AB 为直径时成立。"]], "warm": [{"id": "2w1", "title": "即时练习 1", "text": "“每一条直径都是弦。”判断正误。", "answer": "正确。", "steps": ["直径的两个端点都在圆上，满足弦的定义。", "直径是经过圆心的特殊弦。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": ["正确", "错误"], "correct": 0, "source": "自主补充", "fig": null, "core": true}, {"id": "2w2", "title": "即时练习 2", "text": "一个圆的半径为 3，它的弦最长是多少？", "answer": "6。", "steps": ["最长的弦是直径。", "直径＝2×3＝6。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主补充", "fig": null, "core": true}], "example": {"id": "2e", "title": "典例 2 · 逐句辨析", "text": "判断：<br>①直径是弦；②弦是直径；③半径相等的两个半圆是等弧；④长度相等的两条弧是等弧；⑤半圆是弧，但弧不一定是半圆。<br>正确的说法共有几个？", "answer": "C，共 3 个：①③⑤。", "steps": ["①正确，直径是经过圆心的弦。", "②错误，例如不经过圆心的弦就不是直径。", "③正确，所在圆半径相等，两个半圆能够完全重合。", "④错误，等长的弧可能来自半径不同的圆，不一定能够重合。", "⑤正确，半圆只是弧的一种。因此正确的有①③⑤，共 3 个。"], "hints": ["辨清“所有”和“部分”。", "第④句仅有长度相等，是否足够？"], "options": ["A. 1 个", "B. 2 个", "C. 3 个", "D. 4 个"], "correct": 2, "source": "资料·典例 2", "fig": {"type": "concept"}, "core": true}, "practice": [{"id": "2p1", "title": "变式 2-1 · 弦的上限", "text": "圆的半径为 4，哪一个数不可能是圆中一条弦的长度？", "answer": "D，10。", "steps": ["直径为 8，弦长不能超过 8。", "10＞8，因此选 D。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": ["A. 2", "B. 4", "C. 8", "D. 10"], "correct": 3, "source": "资料·变式 2-1", "fig": null, "core": true}, {"id": "2p2", "title": "变式 2-2 · 等号能不能取", "text": "AB 是半径为 4 的圆的一条弦，AB 的长不可能是多少？", "answer": "A，9。", "steps": ["弦长满足 0＜AB≤8。", "AB＝8 时为直径，可以发生；9＞8，不可能发生。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": ["A. 9", "B. 8", "C. 7", "D. 6"], "correct": 0, "source": "资料·变式 2-2", "fig": null, "core": false}, {"id": "2p3", "title": "变式 2-3 · 同一弦对应的两条弧", "text": "下列说法中，不正确的是哪一项？", "answer": "B。", "steps": ["A 是直径的定义，正确。", "B 不正确：非直径的弦对应一条优弧和一条劣弧，两弧不相等；只有直径对应的两个半圆才是等弧。", "C 正确，由 C＝2πr，周长相等可推出半径相等。", "D 正确，能完全重合的弧，长度当然相等。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": ["A. 过圆心的弦是直径", "B. 同一条弦所对的两条弧一定是等弧", "C. 周长相等的两个圆是等圆", "D. 等弧的长度一定相等"], "correct": 1, "source": "资料·变式 2-3", "fig": {"type": "arcs"}, "core": false}, {"id": "2p4", "title": "补充 1 · 怎样让弦最长", "text": "A 是 ⊙O 上的定点，B 在圆上运动。怎样确定 B，才能使 AB 最长？说明理由。", "answer": "把 AO 延长，与圆的另一交点就是 B；最大长度为 2r。", "steps": ["任意一条弦都不超过直径 2r。", "当 A、O、B 共线，且 O 在 A、B 之间时，AB＝OA＋OB＝2r。", "所以延长 AO，取圆的另一侧交点即可。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主补充", "fig": {"type": "concept"}, "core": false}, {"id": "2p5", "title": "补充 2 · 等长不一定是等弧", "text": "甲圆半径为 3，取一条半圆弧；乙圆半径为 6，取一条四分之一圆弧。两弧是否等长？是不是等弧？", "answer": "等长，均为 3π；不是等弧。", "steps": ["甲的弧长＝(1/2)×2π×3＝3π。", "乙的弧长＝(1/4)×2π×6＝3π。", "两弧所在圆的半径不同，弯曲形状不同，不能完全重合。", "所以等长却不是等弧。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主补充", "fig": {"type": "twoarcs"}, "core": false}], "lab": "chord"}, {"id": 3, "title": "圆的周长与面积计算", "sub": "先找半径，再分清一次变化与平方变化。", "rules": [["周长与面积", "<div class='formula'>C＝2πr＝πd<br>S＝πr²<\/div>这里 d 表示直径，不是点到圆心的距离。"], ["半径增加 a", "<div class='formula'>ΔC＝2πa<br>ΔS＝2πra＋πa²<\/div>周长增量与原半径无关；面积增量通常与原半径有关。"], ["圆环", "<div class='formula'>S<sub>圆环<\/sub>＝π(R²−r²)<\/div>R、r 分别为外、内半径。不要误写为 π(R−r)²。"]], "proof": ["公式怎样得到？", ["π 定义为圆的周长与直径的比值，因此 C/d＝π，得 C＝πd＝2πr。", "把圆分成许多小扇形，交错拼接，形状越来越接近一个长约为半个周长、宽约为 r 的长方形。", "通过分割拼补作直观说明，S＝(C/2)·r＝πr²。本课不引入极限运算。", "将 r 换成 r＋a 再相减：ΔC＝2π(r＋a)−2πr＝2πa。", "面积增量为 π(r＋a)²−πr²＝2πra＋πa²；平方要作用于整个 r＋a。"]], "warm": [{"id": "3w1", "title": "即时练习 1", "text": "圆的半径为 3，求周长与面积，保留 π。", "answer": "周长 6π，面积 9π。", "steps": ["C＝2π×3＝6π。", "S＝π×3²＝9π。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主补充", "fig": null, "core": true}, {"id": "3w2", "title": "即时练习 2", "text": "半径扩大到原来的 2 倍，周长、面积分别变成原来的几倍？", "answer": "周长 2 倍，面积 4 倍。", "steps": ["新周长＝2π(2r)＝2×2πr。", "新面积＝π(2r)²＝4πr²。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主补充", "fig": null, "core": true}], "example": {"id": "3e", "title": "典例 3 · 等分直径", "text": "AB 是大圆的直径，AB＝2r，大圆周长为 L、面积为 S。将 AB 平均分成 n 段，以每段为直径作小圆。<br>（1）分别求 n＝3、4、一般 n 时每个小圆的周长。<br>（2）求每个小圆的面积 Sₙ 与 S 的关系。", "answer": "L₃＝L/3，L₄＝L/4，Lₙ＝L/n；Sₙ＝S/n²。", "steps": ["每个小圆的直径为 2r/n，半径为 r/n。", "小圆周长 Lₙ＝2π(r/n)＝L/n。因此 n＝3 时为 L/3，n＝4 时为 L/4。", "小圆面积 Sₙ＝π(r/n)²＝S/n²。", "补充核对：n 个小圆周长和为 L，面积和为 S/n。n＞1 时，面积和不是 S。"], "hints": ["先写出小圆半径。", "半径缩为 1/n，面积要乘以这个比例的平方。"], "options": null, "correct": null, "source": "资料·典例 3；末步为教学补充", "fig": {"type": "split", "n": 4}, "core": true}, "practice": [{"id": "3p1", "title": "变式 3-1 · 相同的半径增量", "text": "把火星、地球的赤道近似看成圆。题设火星赤道半径为地球的 53%。若两者半径都增加 1 km，哪个赤道周长增加得更多？", "answer": "一样多，均增加 2π km。", "steps": ["设任一个圆的半径为 r km。", "周长增量＝2π(r＋1)−2πr＝2π km。", "结果不含原半径，所以两者增加得一样多，题设的 53% 不影响结果。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": ["A. 地球", "B. 火星", "C. 一样多", "D. 无法确定"], "correct": 2, "source": "资料·变式 3-1（按题设作数学模型）", "fig": null, "core": true}, {"id": "3p2", "title": "变式 3-2 · 圆环与正方形", "text": "两个同心圆组成的圆环面积为 16。以 O 为共同顶点，分别用外、内半径作正方形 OABC、ODEF，其中 D 在 OA 上，F 在 OC 上。求大正方形去掉小正方形后的阴影面积。", "answer": "16/π。", "steps": ["设外半径 R、内半径 r。圆环面积给出 π(R²−r²)＝16。", "因此 R²−r²＝16/π。", "两个正方形的面积分别为 R²、r²，阴影面积就是二者的差，故为 16/π。不必分别求半径。"], "hints": ["把两种面积都写成 R²−r² 的形式。", "阴影是正方形之差，不是圆环本身。"], "options": null, "correct": null, "source": "资料·变式 3-2；阴影范围按原解析图明确", "fig": {"type": "ringSquares"}, "core": false}, {"id": "3p3", "title": "变式 3-3 · 人数与圆周长", "text": "n 个同学均匀围成半径 1 m 的圆圈。<br>（1）n＝6 时，相邻两人的圆弧长是多少？<br>（2）增加两人后，每人沿半径后退 a m 并均匀排列；再增加一人后，又后退 b m 并均匀排列。调整后相邻圆弧长都保持最初不变，求 b/a。", "answer": "（1）π/3 m；（2）1/2。", "steps": ["（1）原周长 2π m，6 人均分圆周，故每段弧长 2π/6＝π/3 m。", "（2）按一般 n 计算，原每段弧长 2π/n。", "第一次有 n＋2 人，2π(1＋a)/(n＋2)＝2π/n，得 na＝2，即 a＝2/n。", "第二次半径为 1＋a＋b，共 n＋3 人，2π(1＋a＋b)/(n＋3)＝2π/n，得 n(a＋b)＝3。", "结合 na＝2，得 nb＝1，b＝1/n。所以 b/a＝1/2。", "原解析以 n＝6 演算；这里补充一般 n 的推导，说明比值与最初人数无关。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "资料·变式 3-3；一般 n 的推导为教学补充", "fig": {"type": "people"}, "core": false}, {"id": "3p4", "title": "补充 1 · 不等分还能保留什么", "text": "大圆直径 AB＝12，P 在线段 AB 上，AP＝4，PB＝8。分别以 AP、PB 为直径作两个小圆。求小圆周长和、面积和，并与大圆比较。", "answer": "周长和 12π，与大圆相等；面积和 20π，小于大圆的 36π。", "steps": ["大圆半径为 6，周长 12π，面积 36π。", "两个小圆半径为 2、4。", "周长和＝2π×2＋2π×4＝12π，与大圆周长相等。", "面积和＝π×2²＋π×4²＝20π，比大圆面积少 16π。", "直径不等分时，周长仍可以相加；面积要各自平方后再相加。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主补充", "fig": {"type": "unequal"}, "core": false}, {"id": "3p5", "title": "补充 2 · 保持面积不变", "text": "将半径为 6 的圆形纸片剪碎，重新拼成 4 个面积相等的小圆（只讨论面积守恒，忽略剪拼损耗）。求每个小圆半径，以及小圆周长总和与原周长的比。", "answer": "半径为 3；周长总和与原周长之比为 2∶1。", "steps": ["原面积 36π，每个小圆面积 9π。", "设小半径 ρ＞0，由 πρ²＝9π，得 ρ＝3。", "4 个小圆的周长总和为 4×6π＝24π，原周长 12π，所以比为 2∶1。", "本题等分的是面积，不是直径，不能直接套用典例的 r/n。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主补充", "fig": {"type": "equalarea"}, "core": false}], "lab": "split"}, {"id": 4, "title": "根据位置关系确定半径范围", "sub": "把位置译成不等式；位置未定时，分情况讨论。", "rules": [["由位置反推半径", "固定 OP＝d：圆内要求 r＞d；圆上要求 r＝d；圆外要求 0＜r＜d。<b>半径必须大于 0。<\/b>"], ["多个点一起判断", "先求到圆心的距离，再从小到大排列。“至少一个”“恰有两个”“不在圆内”含义不同。"], ["两个距离极端", "圆上点 Q 到定点 P 的距离满足：<div class='formula'>PQ最大＝d＋r<br>PQ最小＝|d−r|<\/div>对应共线位置可取得端点。"]], "proof": ["最长与最短为什么要分内外？", ["不共线时，由三角形两边之和、两边之差与第三边的关系，有 |d−r|＜PQ＜d＋r。", "共线时，可以达到边界，因此整个圆上 |d−r|≤PQ≤d＋r。若 P＝O，所有距离都等于 r。", "P 在圆外时最短为 d−r；在圆内时最短为 r−d。未给出 P 的位置，就不能只考虑圆外。", "设最长 L、最短 l，且 L＞l＞0：圆外时 r＝(L−l)/2；圆内时 r＝(L＋l)/2。这是分类列方程得到的。"]], "warm": [{"id": "4w1", "title": "即时练习 1", "text": "OP＝5，P 在 ⊙O 外。求半径 r 的范围。", "answer": "0＜r＜5。", "steps": ["圆外要求 OP＞r，所以 r＜5。", "还要满足 r＞0，得 0＜r＜5。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主补充", "fig": null, "core": true}, {"id": "4w2", "title": "即时练习 2", "text": "OP＝5，P 不在 ⊙O 内。求半径 r 的范围。", "answer": "0＜r≤5。", "steps": ["不在圆内，包括圆上和圆外，所以 OP≥r。", "合并半径为正，得 0＜r≤5。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主补充", "fig": null, "core": true}], "example": {"id": "4e", "title": "典例 4 · 不知道点在内还是外", "text": "点 P 到 ⊙O 上各点的距离，最长为 6 cm、最短为 2 cm。求圆的半径。", "answer": "B，2 cm 或 4 cm。", "steps": ["设 OP＝d、半径为 r。最短不为 0，故 P 不在圆上；需要考虑圆内、圆外。", "圆外：d＋r＝6，d−r＝2，相减得 r＝2；再得 d＝4，确实 d＞r。", "圆内：d＋r＝6，r−d＝2，相加得 r＝4；再得 d＝2，确实 d＜r。", "两种情况都能实现，所以半径是 2 cm 或 4 cm，选 B。"], "hints": ["题目有没有说 P 在圆外？", "圆外用 d−r，圆内用 r−d。"], "options": ["A. 4", "B. 2 或 4", "C. 3 或 2", "D. 4 或 3"], "correct": 1, "source": "资料·典例 4", "fig": {"type": "unknownP"}, "core": true}, "practice": [{"id": "4p1", "title": "变式 4-1 · 保留两种情况", "text": "一个点到圆上各点的最大距离为 5 cm，最小距离为 1 cm。求圆的半径。", "answer": "3 cm 或 2 cm。", "steps": ["圆外时 d＋r＝5，d−r＝1，所以 r＝2、d＝3。", "圆内时 d＋r＝5，r−d＝1，所以 r＝3、d＝2。", "两组都符合对应位置，半径为 2 cm 或 3 cm。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "资料·变式 4-1", "fig": null, "core": true}, {"id": "4p2", "title": "变式 4-2 · 正值条件不能漏", "text": "OP＝6，P 在 ⊙O 外。求半径 r 的范围。", "answer": "0＜r＜6。", "steps": ["P 在圆外，OP＞r，所以 r＜6。", "半径为正，得 0＜r＜6。r＝6 时 P 在圆上，不符合题意。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "资料·变式 4-2", "fig": null, "core": false}, {"id": "4p3", "title": "变式 4-3 · 至少一个在内、至少一个在外", "text": "矩形 ABCD 中，AB＝6 cm，AD＝8 cm。<br>（1）以 A 为圆心、8 cm 为半径作圆，判断 B、C、D 的位置。<br>（2）以 A 为圆心作圆，使 B、C、D 中至少有一点在圆内，且至少有一点在圆外，求半径范围。", "answer": "（1）B 内、C 外、D 上；（2）6＜r＜10（cm）。", "steps": ["到 A 的距离分别为 AB＝6、AD＝8、AC＝√(6²＋8²)＝10。", "（1）与半径 8 比较：6＜8，10＞8，8＝8，所以 B 在内，C 在外，D 在上。", "（2）至少一点在内，半径必须大于最小距离 6，即 r＞6。", "至少一点在外，半径必须小于最大距离 10，即 r＜10。", "合并得 6＜r＜10，两端点都不包含。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "资料·变式 4-3", "fig": {"type": "rectA"}, "core": false}, {"id": "4p4", "title": "补充 1 · 恰有两个在圆内", "text": "OA＝3、OB＝5、OC＝7。若恰有两个点在以 O 为圆心的圆内，另一个点不在圆内，求 r 的范围。", "answer": "5＜r≤7。", "steps": ["只有较近的 A、B 能成为圆内的两个点，所以 r＞5。", "C 不在圆内，允许在圆上或圆外，所以 r≤7。", "合并得 5＜r≤7。r＝5 时圆内仅一个点；r＝7 时仍符合题意。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主补充", "fig": {"type": "distances"}, "core": false}, {"id": "4p5", "title": "补充 2 · 同心圆之间", "text": "两个同心圆的半径为 r 和 r＋2，OP＝5。若 P 在小圆外、大圆内，求 r 的范围。", "answer": "3＜r＜5。", "steps": ["P 在小圆外，5＞r。", "P 在大圆内，5＜r＋2，所以 r＞3。", "合并得 3＜r＜5，两个端点都会让 P 在一个圆上，不能取。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主补充", "fig": {"type": "concentric"}, "core": false}], "lab": "radius"}, {"id": 5, "title": "三角形外心的概念与作图", "sub": "用垂直平分线，找到到三个顶点等距的点。", "rules": [["什么是外心", "三角形外接圆的圆心叫作外心。若 O 是 △ABC 的外心，则 <b>OA＝OB＝OC<\/b>；这是到顶点等距，不是到三边等距。"], ["怎样作图", "作两条边的垂直平分线，交点就是外心。以该点为圆心、到任一顶点的距离为半径作圆。"], ["外心不一定在外", "锐角三角形外心在内部；直角三角形外心在斜边中点；钝角三角形外心在外部。"]], "proof": ["为什么只作两条垂直平分线就够了？", ["若 O 在 AB 的垂直平分线上，M 为 AB 中点。由 AM＝BM、OM 公共及两个直角，△OMA≌△OMB，所以 OA＝OB。", "O 若也在 BC 的垂直平分线上，就有 OB＝OC，进而 OA＝OB＝OC。", "所以以 O 为圆心、OA 为半径的圆同时经过 A、B、C。", "反过来，任何过三点的圆，其圆心都必须在上述两条垂直平分线上。不共线的三点使两线有唯一交点，故圆心唯一。", "因为 OA＝OC，O 还在第三边 AC 的垂直平分线上，不必再作第三条线才确定圆心。"]], "warm": [{"id": "5w1", "title": "即时练习 1", "text": "O 是 △ABC 的外心，OA＝5，求 OB、OC。", "answer": "OB＝OC＝5。", "steps": ["外心到三个顶点等距。", "所以 OA＝OB＝OC＝5。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主补充", "fig": null, "core": true}, {"id": "5w2", "title": "即时练习 2", "text": "AB、BC 的垂直平分线交于 O。O 是否也在 AC 的垂直平分线上？", "answer": "是。", "steps": ["由两条线分别得到 OA＝OB、OB＝OC，所以 OA＝OC。", "到 A、C 等距的点在 AC 的垂直平分线上。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": ["是", "不一定"], "correct": 0, "source": "自主补充", "fig": null, "core": true}], "example": {"id": "5e", "title": "典例 5 · 外心的特征", "text": "对于三角形的外心，下列说法正确的是哪一项？", "answer": "D，到三个顶点的距离相等。", "steps": ["外心是外接圆圆心，也是三边垂直平分线的交点。", "圆心到三个顶点的距离都是外接圆半径，故 D 正确。", "A 把顶点误换成了三边，到三边距离相等是内心的特征；B 的三条高也不是这里的作图对象。", "C 不正确，例如直角三角形外心在斜边上，钝角三角形外心在三角形外部。"], "hints": ["外接圆经过哪三个点？", "把外心连接到三个顶点，得到的都是什么线段？"], "options": ["A. 到三边的距离相等", "B. 是三条高的交点", "C. 一定在三角形内部", "D. 到三个顶点的距离相等"], "correct": 3, "source": "资料·典例 5", "fig": {"type": "triangle", "points": [[0, 4], [-3, 0], [3, 0]]}, "core": true}, "practice": [{"id": "5p1", "title": "变式 5-1 · 外心与圆周角", "text": "⊙O 是锐角 △ABC 的外接圆。判断：<br>①OA＝OB＝OC；②若 ∠A＝60°，则 ∠BOC＝120°；③若 AB＝AC，则 OB⊥AC。<br>错误的结论有几个？<p class='prereq'>本题在已经学习圆周角定理后选做。<\/p>", "answer": "1 个错误：③。", "steps": ["①正确，三个线段都是同圆的半径。", "②正确，本题中 ∠A 与小于 180°的 ∠BOC 对同一条劣弧 BC，圆心角等于圆周角的 2 倍，故为 120°。", "③不成立。AB＝AC 能确定的是 AO⊥BC，而不是 OB⊥AC。", "反例：A(0,4)、B(−3,0)、C(3,0) 构成锐角等腰三角形，BA＝5，BC＝6。若 OB⊥AC，由 O 在 AC 的垂直平分线上可知 B 也在其上，就会得到 BA＝BC，与 5≠6 矛盾。", "因此只有③错误。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "资料·变式 5-1；反例为教学补充", "fig": {"type": "triangle", "points": [[0, 4], [-3, 0], [3, 0]]}, "core": false}, {"id": "5p2", "title": "变式 5-2 · 阅读尺规作图", "text": "A、B、C 不共线。作 AB、BC 的垂直平分线交于 O，以 O 为圆心、OB 为半径作圆。哪一项一定正确？", "answer": "D。", "steps": ["作图保证 OA＝OB＝OC，因此 O 是外心，不是由该作图确定的内心。", "弧 AB、BC 是否相等还需要弦长等条件，不能断言相等。", "OA、OC 都等于半径 OB，当然也是半径。", "由 OA＝OC，O 在 AC 的垂直平分线上，所以 D 正确。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": ["A. O 是三角形内心", "B. 弧 AB、BC 一定相等", "C. OA、OC 不是这个圆的半径", "D. O 在 AC 的垂直平分线上"], "correct": 3, "source": "资料·变式 5-2", "fig": {"type": "triangle", "points": [[0, 4], [-3, 0], [3, 0]]}, "core": true}, {"id": "5p3", "title": "变式 5-3 · 作图后求半径", "text": "△ABC 中，AB＝AC＝13，BC 边上的中线 AD＝12。<br>（1）用尺规作出外接圆，保留作图痕迹。<br>（2）求外接圆半径。", "answer": "作两边的垂直平分线确定外心；半径为 169/24。", "steps": ["AB＝AC，AD 是中线，所以也是 BC 的垂直平分线。", "以 A、C 为圆心，用同一个大于 AC/2 的半径作交弧，连接交点，作出 AC 的垂直平分线；与 AD 交于 O。", "以 O 为圆心、OA 为半径作圆，保留作垂直平分线的交弧。", "AD⊥BC，BD＝√(13²−12²)＝5。这是锐角等腰三角形，O 在线段 AD 上。", "设 OA＝OB＝R，则 OD＝12−R。在 Rt△ODB 中，R²＝(12−R)²＋5²。", "展开并消去 R²，得 24R＝169，所以 R＝169/24。R＜12，与 O 在线段 AD 上相符。"], "hints": ["AD 在等腰三角形中还是什么特殊线？", "用 OB²＝OD²＋BD² 列式。"], "options": null, "correct": null, "source": "资料·变式 5-3", "fig": {"type": "iso", "half": 5, "height": 12, "side": "13", "hlabel": "12"}, "core": false}, {"id": "5p4", "title": "补充 1 · 恢复圆形薄片的圆心", "text": "一块圆形薄片的圆心标记丢失，圆边上保留三个不共线的点 A、B、C。怎样用圆规和直尺恢复圆心？为什么结果唯一？", "answer": "作 AB、BC 的垂直平分线，交点为唯一圆心。", "steps": ["用等半径交弧法，分别作 AB、BC 的垂直平分线。", "两线交于 O。OA＝OB＝OC，因此 O 可作过三点的圆的圆心。", "原圆圆心也必须到三点等距，所以必在这两条垂直平分线上，只能是 O。", "不共线保证两条垂直平分线有唯一交点。只有两个边界点时，圆心仍可在整条垂直平分线上。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主补充", "fig": {"type": "triangle", "points": [[0, 4], [-3, 0], [3, 0]], "broken": true}, "core": false}, {"id": "5p5", "title": "补充 2 · 少了“不共线”", "text": "A、B、C 依次在同一直线上，AB＝2，BC＝3。能否作一个圆同时经过三点？用垂直平分线说明。", "answer": "不能。", "steps": ["假设存在圆心 O，它必须同时在 AB、BC 的垂直平分线上。", "AB、BC 共线，它们的垂直平分线都垂直于同一直线。", "两个线段的中点不同，所以两条垂直平分线是不同的平行线，不会相交。", "没有同时满足条件的圆心，因此不存在这样的圆。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主补充", "fig": {"type": "collinear"}, "core": false}], "lab": "construct"}, {"id": 6, "title": "确定三角形外心的坐标", "sub": "先用图形减少未知量，再用等距补上条件。", "rules": [["先找特殊方向", "水平线段的垂直平分线是竖直线；竖直线段的垂直平分线是水平线。先找这类边，往往能直接确定一个坐标。"], ["坐标记录距离", "水平、竖直距离组成直角三角形，用勾股定理计算距离的平方。不需要使用圆的标准方程。"], ["两个不同的圆", "外接圆要经过三个顶点；最小覆盖圆只要求装下整个三角形，顶点可以在圆内，两者不一定相同。"]], "proof": ["怎样把“到两点等距”写成等式？", ["例如 A(0,4)、B(4,4)，AB 中点是 (2,4)，因此外心在直线 x＝2 上。", "设 M(2,k)。到 A 的水平距离为 2，竖直距离为 |k−4|，所以 MA²＝4＋(k−4)²。", "若 C(6,2)，则 MC²＝16＋(k−2)²。由 MA＝MC，把两个平方设为相等。", "展开后 k² 会相消，得到一次方程。先用垂直平分线，再用等距，就把两个未知数减为一个。"]], "warm": [{"id": "6w1", "title": "即时练习 1", "text": "A(1,2)、B(5,2)，求 AB 的垂直平分线。", "answer": "x＝3。", "steps": ["AB 水平，中点横坐标为 (1＋5)/2＝3。", "经过该中点的竖直线为 x＝3。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主补充", "fig": null, "core": true}, {"id": "6w2", "title": "即时练习 2", "text": "O(1,1)、P(4,5)，求 OP。", "answer": "5。", "steps": ["水平距离为 3，竖直距离为 4。", "OP＝√(3²＋4²)＝5。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主补充", "fig": null, "core": true}], "example": {"id": "6e", "title": "典例 6 · 三点确定圆心", "text": "一条圆弧经过 A(0,4)、B(4,4)、C(6,2)。求所在圆的圆心。", "answer": "(2,0)。", "steps": ["AB 水平，其中点 (2,4)，圆心在 x＝2 上，设 M(2,k)。", "由勾股定理，MA²＝4＋(k−4)²，MC²＝16＋(k−2)²。", "令 MA²＝MC²，得 4＋(k−4)²＝16＋(k−2)²。", "展开消去 k²，得 20−8k＝20−4k，所以 k＝0，M(2,0)。", "检查：MA²＝MB²＝MC²＝20，确实到三点等距。"], "hints": ["AB 是水平线段，能先确定哪个坐标？", "只设剩下的坐标为 k，再用 MA²＝MC²。"], "options": null, "correct": null, "source": "资料·典例 6；等距法教学展开", "fig": {"type": "grid", "points": [[0, 4, "A"], [4, 4, "B"], [6, 2, "C"]], "arc": true}, "core": true}, "practice": [{"id": "6p1", "title": "变式 6-1 · 从网格恢复坐标", "text": "每小格边长为 1。按图中常规方向建立坐标系，已知 A(−1,−1)，B、C 的格点位置如图，求外心坐标。", "answer": "(0,1)。", "steps": ["由 A 的坐标确定坐标系，读得 B(2,0)、C(2,2)。", "BC 竖直，其中点为 (2,1)，故外心在 y＝1 上，设 M(k,1)。", "MA²＝(k＋1)²＋4，MC²＝(k−2)²＋1。", "由两式相等，k²＋2k＋5＝k²−4k＋5，得 k＝0，M(0,1)。", "到三点的距离平方都为 5，检查成立。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "资料·变式 6-1；按原网格重绘", "fig": {"type": "grid", "points": [[-1, -1, "A"], [2, 0, "B"], [2, 2, "C"]]}, "core": true}, {"id": "6p2", "title": "变式 6-2 · 外接圆与最小覆盖圆", "text": "A(3,6)、B(1,4)、C(1,0)，每格边长为 1。<br>（1）只用无刻度直尺、利用格点作外接圆圆心 M。<br>（2）写出 M 的坐标。<br>（3）求 M 到弦 AC 的距离。<br>（4）求三角形的最小覆盖圆半径。", "answer": "M(5,2)；到 AC 的距离 √10；最小覆盖圆半径 √10。", "steps": ["BC 的中点为格点 (1,2)，连接 (0,2)、(6,2) 可作其垂直平分线 y＝2。", "AB 中点为 (2,5)。AB 沿右 1、上 1 的方向，所以中垂线沿右 1、下 1 的方向，连接格点 (2,5)、(5,2)。两线交于 M(5,2)。", "MA²＝(5−3)²＋(2−6)²＝20，所以外接圆半径为 2√5。", "取 AC 中点 N(2,3)。因 MA＝MC，MN⊥AC，因此所求距离 MN＝√[(5−2)²＋(2−3)²]＝√10。", "AC＝2√10。任何覆盖 A、C 的圆，半径都至少为 AC/2＝√10。", "以 N 为圆心、NA＝√10 为半径的圆，NB＝√2＜√10，能够包含 B，也能包含整个三角形。", "下界能够取得，所以最小覆盖圆半径为 √10。它不是外接圆，不能填 2√5。"], "hints": ["先找两条能用格点连出的垂直平分线。", "覆盖圆不要求 B 在圆周上；试试以最长边 AC 为直径。"], "options": null, "correct": null, "source": "资料·变式 6-2；圆心改记 M，补充最小性证明", "fig": {"type": "grid", "points": [[3, 6, "A"], [1, 4, "B"], [1, 0, "C"]]}, "core": false}, {"id": "6p3", "title": "变式 6-3 · 找圆心，再判断位置", "text": "按网格读得 A(−2,−1)、B(0,1)、C(4,−1)。<br>（1）求过三点的圆的圆心 M。<br>（2）判断 D(−3,−2) 的位置。", "answer": "M(1,−2)，D 在圆外。", "steps": ["AC 水平，中点 (1,−1)，所以圆心横坐标为 1，设 M(1,k)。", "MA²＝9＋(k＋1)²，MB²＝1＋(k−1)²。", "等距给出 10＋2k＝2−2k，故 k＝−2，M(1,−2)。", "半径平方 R²＝MB²＝10；MD＝4，MD²＝16＞10。", "因此 D 在圆外。不用把 √10 化为近似值也能判断。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "资料·变式 6-3；坐标由原网格转写", "fig": {"type": "grid", "points": [[-2, -1, "A"], [0, 1, "B"], [4, -1, "C"]], "extra": [[-3, -2, "D"]], "arc": true}, "core": false}, {"id": "6p4", "title": "补充 1 · 利用对称，再检验新点", "text": "A(−2,1)、B(4,1)、C(1,4)。求外心，判断 D(1,−2) 是否在外接圆上。", "answer": "外心 (1,1)，D 在圆上。", "steps": ["AB 的中垂线为 x＝1，设 M(1,k)。", "MA²＝9＋(k−1)²，MC²＝(k−4)²。", "令两式相等，10−2k＝16−8k，得 k＝1。", "M(1,1)，半径 MC＝3，MD＝3，所以 D 在圆上。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主补充", "fig": {"type": "grid", "points": [[-2, 1, "A"], [4, 1, "B"], [1, 4, "C"]], "extra": [[1, -2, "D"]]}, "core": false}, {"id": "6p5", "title": "补充 2 · 圆心还在一条直线上", "text": "圆经过 A(0,0)、B(6,0)，圆心 M 在 y＝x−1 上。求圆心、半径，再判断 C(4,5) 的位置。", "answer": "M(3,2)，半径 √13，C 在圆内。", "steps": ["由 MA＝MB，圆心在 AB 的中垂线 x＝3 上。", "代入 y＝x−1，得 y＝2，所以 M(3,2)。", "R²＝MA²＝3²＋2²＝13，R＝√13。", "MC²＝1²＋3²＝10＜13，因此 C 在圆内。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主补充", "fig": {"type": "grid", "points": [[0, 0, "A"], [6, 0, "B"]], "extra": [[4, 5, "C"]], "line": true}, "core": false}], "lab": "grid"}, {"id": 7, "title": "三角形外接圆半径的计算", "sub": "找一个含半径的直角三角形，把等距写进勾股定理。", "rules": [["直角三角形", "斜边中点是外心。<div class='formula'>外接圆直径＝斜边 c<br>R＝c/2<\/div>看清题目求的是直径还是半径。"], ["等腰与等边", "外心在底边的垂直平分线上，常用半个底边、圆心到中点的距离列勾股关系。等边三角形边长 a 时，R＝a√3/3。"], ["外心在外部时", "仍可用勾股定理。若外心在底边另一侧、高为 h，常有 OD＝R−h；不能把线段长度写成负数。"]], "proof": ["斜边中点为什么是外心？", ["把 Rt△ABC（∠C＝90°）补成矩形，使 AB 是矩形的一条对角线。", "矩形的两条对角线相等且互相平分。设交点 O，则 OA＝OB＝OC＝AB/2。", "所以 O 到三个顶点等距，是外心，半径 R＝AB/2。", "等边三角形也可用勾股：高 h＝a√3/2。设半径 R，由 R²＝(a/2)²＋(h−R)²，得 2hR＝a²，所以 R＝a√3/3。"]], "warm": [{"id": "7w1", "title": "即时练习 1", "text": "直角三角形斜边为 12，求外接圆半径。", "answer": "6。", "steps": ["外接圆直径等于斜边 12。", "半径为 12/2＝6。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主补充", "fig": null, "core": true}, {"id": "7w2", "title": "即时练习 2", "text": "等边三角形边长为 3，求外接圆半径。", "answer": "√3。", "steps": ["R＝a√3/3。", "代入 a＝3，得 R＝√3。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主补充", "fig": null, "core": true}], "example": {"id": "7e", "title": "典例 7 · 求的是直径", "text": "直角三角形的两条直角边为 6 和 8，求外接圆直径。", "answer": "C，10。", "steps": ["斜边＝√(6²＋8²)＝10。", "外接圆直径等于斜边，故为 10，选 C。", "5 是半径，不是本题要求的直径。"], "hints": ["先求最长边。", "直角三角形外接圆以哪条边为直径？"], "options": ["A. 5", "B. 4", "C. 10", "D. 8"], "correct": 2, "source": "资料·典例 7", "fig": {"type": "right", "a": 6, "b": 8}, "core": true}, "practice": [{"id": "7p1", "title": "变式 7-1 · 30°角与勾股定理", "text": "Rt△ABC 中，∠C＝90°，∠A＝60°，BC＝4。求外接圆直径。", "answer": "8√3/3。", "steps": ["∠B＝30°。30°角所对直角边等于斜边的一半，所以 AC＝AB/2。", "由勾股定理，16＋(AB/2)²＝AB²。", "得 (3/4)AB²＝16，AB²＝64/3，AB＝8√3/3。", "外接圆直径为斜边 AB，故为 8√3/3。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "资料·变式 7-1", "fig": {"type": "angleRight"}, "core": true}, {"id": "7p2", "title": "变式 7-2 · 钝角等腰三角形", "text": "AB＝AC＝4，∠BAC＝120°。用尺规作出 △ABC 的外接圆，并求半径。", "answer": "半径为 4。", "steps": ["用等半径交弧分别作 AB、AC 的垂直平分线，交于 O；以 O 为圆心、OA 为半径作圆，保留交弧。", "等腰三角形的对称轴经过 A 和 BC 中点 D，外心 O 在此轴上。三角形为钝角，O 在 BC 的另一侧。", "对称轴平分顶角，∠BAO＝60°。又 OA＝OB，所以 ∠ABO＝60°。", "△AOB 为等边三角形，OA＝AB＝4，故半径为 4。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "资料·变式 7-2", "fig": {"type": "iso", "half": 3.4641016151377544, "height": 2, "side": "4", "angle": "120°"}, "core": false}, {"id": "7p3", "title": "变式 7-3 · 每小格不是 1", "text": "格点三角形如图，每个小正方形边长为 2。<br>（1）只用无刻度直尺作外心 O。<br>（2）求外接圆半径。", "answer": "2√10。", "steps": ["以 B 为临时原点，用格数记录，C 在 (6,0)，A 在 (2,4)。这里一单位是一小格。", "BC 的中垂线是 x＝3。AC 中点为 (4,2)，其中垂线沿右 1、上 1 方向，连接格点即可作出。", "两条线交于 O(3,1)，仍以格数计。", "实际 OB 的水平距离为 3×2＝6，竖直距离为 1×2＝2。", "OB＝√(6²＋2²)＝2√10，即外接圆半径。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "资料·变式 7-3；保持原格点相对位置重绘", "fig": {"type": "grid", "points": [[2, 4, "A"], [0, 0, "B"], [6, 0, "C"]], "unit": 2, "noAxes": true}, "core": false}, {"id": "7p4", "title": "补充 1 · 用推导替代直接背公式", "text": "等边 △ABC 的边长为 6。作高 AD，用勾股定理推得外接圆半径，不直接代入等边半径公式。", "answer": "2√3。", "steps": ["BD＝3，AD＝√(6²−3²)＝3√3。", "外心 O 在 AD 上，设 OA＝OB＝R，则 OD＝3√3−R。", "由勾股定理，R²＝3²＋(3√3−R)²。", "展开得 6√3R＝36，故 R＝2√3。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主补充", "fig": {"type": "iso", "half": 3, "height": 5.196152422706632, "side": "6"}, "core": false}, {"id": "7p5", "title": "补充 2 · 由面积求高", "text": "等腰 △ABC 的底边 BC＝16，面积为 48。求外接圆半径，并判断外心位置。", "answer": "R＝25/3，外心在三角形外部。", "steps": ["作高 AD，48＝(1/2)×16×AD，所以 AD＝6，BD＝8。", "在 Rt△ABD 中，BD＞AD，故 ∠BAD＞45°，顶角 ∠BAC＞90°。外心在底边另一侧。", "设 OA＝OB＝R，则 OD＝R−6。", "由勾股定理，R²＝8²＋(R−6)²，展开得 12R＝100。", "所以 R＝25/3＞6，与 OD＞0 相符。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主补充", "fig": {"type": "iso", "half": 8, "height": 6, "base": "16", "area": "S＝48"}, "core": false}], "lab": "right"}, {"id": 8, "title": "点与圆上一点的最值问题", "sub": "先识别固定距离，再检查取等位置能否到达。", "rules": [["隐藏的圆", "折叠、轴对称和旋转保持某些距离。若 E 固定、EG 始终等长，G 就在以 E 为圆心的圆或一段圆弧上。"], ["关键的取等检查", "圆心距加、减半径，是整个圆上的候选最值。动点只走一段弧时，共线的取等点可能不能到达，还要检查端点。"], ["连杆与轨道", "先找 OP 的范围，再由 AP²＝OP²−OA² 求滑块位置。一周的往返路程是两端位置差的 2 倍。"]], "proof": ["为什么折叠能转化为圆？", ["点 A 关于过固定点 E 的直线对称到 G，轴对称保持距离，E 又不动，所以 EG＝EA。", "EA 是定长，所以 G 在以 E 为圆心、EA 为半径的圆上；对称轴受限制时，G 往往只走一段圆弧。", "整个圆上到定点 C 的距离，最小为 |CE−EA|、最大为 CE＋EA。", "若相应共线点不在允许的弧上，就不能取等号，必须结合实际运动弧与端点判断。", "本章在轴对称、勾股定理与直角三角形斜边中线性质学完后选做，不计入本课 90 分钟主线。"]], "warm": [{"id": "8w1", "title": "即时练习 1", "text": "圆半径为 2，OP＝5，Q 在整个圆上运动，求 PQ 的最小值、最大值。", "answer": "最小值 3，最大值 7。", "steps": ["P 在圆外。", "最小＝5−2＝3，最大＝5＋2＝7。整圆上的两个共线位置均可到达。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主补充", "fig": null, "core": true}, {"id": "8w2", "title": "即时练习 2", "text": "A 关于一条过固定点 E 的直线对称到 G，EA＝3。哪个距离始终不变？", "answer": "EG＝3。", "steps": ["轴对称保持距离，E 不动。", "故 EG＝EA＝3，G 在以 E 为圆心、3 为半径的圆上。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主补充", "fig": null, "core": true}], "example": {"id": "8e", "title": "典例 8 · 磨盘与连杆", "text": "如图，磨盘半径 OM＝20 cm，把手 MQ＝15 cm，M 位于 O、Q 之间。PQ＝135 cm，P 在 A 右侧轨道上滑动，OA⊥轨道，OA＝80 cm。<br>（1）求 AP 最大值。<br>（2）磨盘转动 100 周，求 P 滑动的总路程。", "answer": "（1）150 cm；（2）18000 cm。", "steps": ["由点序可知 OQ＝OM＋MQ＝35 cm。", "在连杆结构中，|PQ−OQ|≤OP≤PQ＋OQ，即 100≤OP≤170。", "O、Q、P 共线时取到两个端点；最小 OP＝100＞OA＝80，故在 A 右侧轨道上两个端点均可实现。", "Rt△OAP 中 AP²＝OP²−80²，所以 AP最大＝√(170²−80²)＝150 cm。", "AP最小＝√(100²−80²)＝60 cm。", "每转一周，P 在两个端点之间往返一次，路程为 2×(150−60)＝180 cm。", "100 周为 180×100＝18000 cm。路程不等于起点到终点的距离。"], "hints": ["先将曲柄总长 OQ 补出来。", "先求 OP 的极端值，再用勾股定理换成 AP。"], "options": null, "correct": null, "source": "资料·典例 8；点序及轨道方向按原图明确", "fig": {"type": "crank"}, "core": true}, "practice": [{"id": "8p1", "title": "变式 8-1 · 菱形折叠", "text": "菱形 ABCD 中，AB＝4，∠B＝60°，E 为 AB 中点。P 在 BC 上运动，以 EP 为折痕，把 △BEP 折为 △FEP。求 DF 最小值。", "answer": "2√7−2。", "steps": ["E 固定，折叠保持 EF＝EB＝2，所以 F 在以 E 为圆心、2 为半径的圆弧上。", "过 E 作 EH⊥AD，H 在 AD 的延长线上。由平行与 ∠B＝60°，得 ∠EAH＝60°。", "AE＝2，直角三角形 AEH 中 AH＝1，EH＝√3，DH＝DA＋AH＝5。", "故 DE＝√(5²＋(√3)²)＝2√7。", "DF≥DE−EF＝2√7−2。", "P 从 B 移到 C，F 从 B 沿以 AB 为直径的一侧半圆走到 A；射线 ED 落在这段半圆的方向范围内，F 能在线段 ED 上，所以下界可以取得。", "因此 DF 最小为 2√7−2。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "资料·变式 8-1；补充可达性说明", "fig": {"type": "rhombus"}, "core": false}, {"id": "8p2", "title": "变式 8-2 · 把目标转成圆上点距离", "text": "⊙M 半径为 2，M(3,4)，P 在圆上。PA⊥PB，A、B 在 x 轴上且关于原点 O 对称，求 AB 的最大值。", "answer": "C，14。", "steps": ["A、B 关于 O 对称，O 是 AB 中点。", "∠APB＝90°，直角三角形的斜边中线 OP＝AB/2，所以 AB＝2OP。", "OM＝√(3²＋4²)＝5，OP 最大＝5＋2＝7。", "P 位于射线 OM 上、M 的外侧时可以取得最大值；这时可取 x 轴上距 O 为 OP 的两个端点 A、B。", "因此 AB 最大＝2×7＝14。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": ["A. 10", "B. 12", "C. 14", "D. 16"], "correct": 2, "source": "资料·变式 8-2", "fig": {"type": "axisCircle"}, "core": true}, {"id": "8p3", "title": "变式 8-3 · 只能在一段弧上", "text": "矩形 ABCD 中，AB＝8，AD＝6，E 为 AD 中点。F 从 A 沿 AB 移到 B，G 是 A 关于 EF 的对称点。求 CG 的最大值与最小值之和。", "answer": "7＋√73。", "steps": ["折叠保持 EG＝EA＝3，G 在以 E 为圆心、3 为半径的一段弧上，而非整个圆上任意运动。", "CE＝√(8²＋3²)＝√73。G 能到达线段 EC 上，最小值为 √73−3。", "验证最近点可达：以 A 为原点，AB、AD 为正方向。线段 EC 上距 E 为 3 的点 G，横坐标 x＝24/√73，纵坐标 y＝3＋9/√73；这是按 EG/EC＝3/√73 分配水平、竖直距离得到的。由 EG＝3 得 x²＋y²＝6y。设 F(t,0)，让 FA＝FG，则 t²＝(t−x)²＋y²，得 t＝(x²＋y²)/(2x)＝3y/x＝3(√73＋3)/8≈4.33。这个值在 [0,8] 内。E、F 都到 A、G 等距，所以 EF 正是 AG 的垂直平分线，以 EF 为折痕确能把 A 折到这个最近点 G。", "最大值不能直接取 CE＋3，因为整圆上最远的点不在允许弧上。F＝A 时，G＝A，此时 CG＝CA＝10。", "验证上界：以 A 为原点、AB 和 AD 为正方向，记 G(x,y)。允许弧上 x≥0、y≥0。由 EG＝3 和 E(0,3)，展开勾股关系得 x²＋y²＝6y。", "因此 CG²＝(8−x)²＋(6−y)²＝100−16x−6y≤100。所以最大值确实是 10。", "最大值与最小值之和＝10＋√73−3＝7＋√73。"], "hints": ["先判断轨迹是整圆还是一段弧。", "F 与 A 重合时，G 在哪里？"], "options": null, "correct": null, "source": "资料·变式 8-3；补充上界与取等位置验证", "fig": {"type": "fold"}, "core": false}, {"id": "8p4", "title": "补充 1 · 反过来求两条杆长", "text": "同类连杆装置中，OA⊥轨道，OA＝12，P 始终在 A 右侧。AP 最小为 9、最大为 35；连杆 PQ 长于曲柄 OQ，曲柄可整周转动。求 OQ、PQ 及 P 每周路程。", "answer": "OQ＝11，PQ＝26；每周路程 52。", "steps": ["先求 OP：最小＝√(9²＋12²)＝15，最大＝√(35²＋12²)＝37。", "设曲柄 r、连杆 l，l＞r，则 l−r＝15，l＋r＝37。", "相加得 2l＝52，l＝26；相减得 2r＝22，r＝11。", "滑块每周往返一次，路程＝2×(35−9)＝52。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主补充", "fig": {"type": "crank", "inverse": true}, "core": false}, {"id": "8p5", "title": "补充 2 · 对称轴可以任意转动", "text": "正方形 ABCD 边长为 6，E 为 AD 中点。一条过 E 的直线可任意转动，G 为 A 关于该直线的对称点。求 CG 最小值、最大值，说明均可取得。", "answer": "最小 3√5−3，最大 3√5＋3。", "steps": ["EG＝EA＝3。对称轴不受线段限制，因此 G 能遍历整个圆。", "CE＝√(6²＋3²)＝3√5。", "所以 CG 最小＝CE−3，最大＝CE＋3，即 3√5−3、3√5＋3。", "直线 CE 与圆的两个交点分别取得最小、最大值。任取其中一个 G，AG 的垂直平分线经过 E，因为 EA＝EG；以它为对称轴即可实现。", "与上一道折叠题相比，对称轴的允许范围不同，取等情况也不同。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主补充", "fig": {"type": "fold", "full": true}, "core": false}], "lab": "motion"}, {"id": 9, "title": "二次函数与圆的综合问题", "sub": "先求交点，再找外心，最后回到面积或运动。", "rules": [["先确认前置知识", "本章为九年级综合选学，需已学习二次函数、交点、配方、对称轴。尚未学习时，先完成第 1—7 章与离堂检测。"], ["三个基本步骤", "先求点：令 y＝0 或 x＝0。<br>再找心：垂直平分线＋等距。<br>最后求量：勾股、面积、运动关系。"], ["检查退化与折返", "三点重合或共线时没有三角形外接圆。运动中要检查端点和转折，路径长度不一定等于起终点距离。"]], "proof": ["不使用圆的标准方程，怎样求外心？", ["若 A(α,0)、B(β,0) 在 x 轴上，圆心在 AB 的中垂线 x＝(α＋β)/2 上。", "记 h＝(α＋β)/2，设圆心 D(h,k)，只剩未知量 k。", "第三点 C(0,c) 时，由勾股定理，DA²＝(h−α)²＋k²，DC²＝h²＋(k−c)²。", "令两式相等，k² 消去。求出 k 后，检查三点是否互不相同且不共线。", "全程只用已学坐标、方程、勾股定理，不需要向量、导数或圆的标准方程。"]], "warm": [{"id": "9w1", "title": "即时练习 1", "text": "求 y＝−x²＋2x＋3 与 x 轴、y 轴的交点。", "answer": "与 x 轴交于 (−1,0)、(3,0)，与 y 轴交于 (0,3)。", "steps": ["令 y＝0，(x−3)(x＋1)＝0，得 x＝−1 或 3。", "所以 x 轴交点为 (−1,0)、(3,0)。", "令 x＝0 得 y＝3，故 y 轴交点为 (0,3)。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主补充", "fig": null, "core": true}, {"id": "9w2", "title": "即时练习 2", "text": "A(−1,0)、B(3,0)。过 A、B 的圆的圆心横坐标是多少？仅凭这两个点能确定纵坐标吗？", "answer": "横坐标为 1，纵坐标还不能确定。", "steps": ["AB 的中垂线是 x＝1，所以圆心横坐标为 1。", "圆心仍可在该直线上移动，还需要第三个条件。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主补充", "fig": null, "core": true}], "example": {"id": "9e", "title": "典例 9 · 面积差中的不变量", "text": "y＝−x²＋(m−1)x＋m（m＞1）与 x 轴交于 A、B（A 在左），与 y 轴交于 C，D 为 △ABC 外心。记 S₁＝S<sub>△ACD<\/sub>，S₂＝S<sub>△ABD<\/sub>，求 S₁−S₂。", "answer": "1/2。", "steps": ["因式分解 y＝−(x＋1)(x−m)，得 A(−1,0)、B(m,0)；令 x＝0，得 C(0,m)。", "AB 中垂线给出 D 的横坐标 h＝(m−1)/2。设 D(h,k)。", "由 DA²＝DC²，(h＋1)²＋k²＝h²＋(k−m)²。展开为 2h＋1＝m²−2mk；代入 2h＋1＝m，得 k＝(m−1)/2＝h。", "因此 DA²＝DC²＝[(m＋1)²＋(m−1)²]/4＝(m²＋1)/2；AC²＝m²＋1。", "DA²＋DC²＝AC²，故 △ADC 在 D 处为直角，且 DA＝DC。所以 S₁＝(1/2)DA·DC＝(m²＋1)/4。", "m＞1，D 到 x 轴的距离为 (m−1)/2；AB＝m＋1，故 S₂＝(m²−1)/4。", "相减得 S₁−S₂＝[(m²＋1)−(m²−1)]/4＝1/2，与 m 无关。"], "hints": ["先把抛物线表达式因式分解。", "外心先确定一个坐标，另一个由等距求出。"], "options": null, "correct": null, "source": "资料·典例 9；等距与勾股逆定理的补充解法", "fig": {"type": "parabola", "family": "example"}, "core": true}, "practice": [{"id": "9p1", "title": "变式 9-1 · 外接圆还经过原点", "text": "抛物线 y＝ax²−4ax＋2（a＞0）与 y 轴交于 A，B 是 A 关于对称轴的对称点，C 是顶点。若 △ABC 外接圆经过原点 O，求 a。", "answer": "(1＋√5)/4。", "steps": ["配方 y＝a(x−2)²＋2−4a，得 A(0,2)、B(4,2)、C(2,2−4a)。", "圆经过 O、A、B，圆心在 OA 中垂线 y＝1 和 AB 中垂线 x＝2 上，故 M(2,1)。", "半径 MO＝√5。", "MC＝|1−4a|＝√5，所以 a＝(1−√5)/4 或 (1＋√5)/4。", "a＞0，舍去负值，故 a＝(1＋√5)/4。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "资料·变式 9-1", "fig": {"type": "parabola", "family": "four"}, "core": false}, {"id": "9p2", "title": "变式 9-2 · 同高面积比与四点共圆", "text": "y＝−x²＋bx＋c 与 x 轴正半轴交于 A(3,0)，与 y 轴交于 B(0,3)。P 在线段 OA 上运动，过 P 作 x 轴垂线，交抛物线于 C、直线 AB 于 D。<br>（1）求抛物线表达式。<br>（2）在非退化的 △PDB、△CDB 中，一者面积为另一者的 2 倍时，求 P。<br>（3）若 △BCP 的外接圆还经过 A，求 C。", "answer": "（1）y＝−x²＋2x＋3；（2）P(1/2,0) 或 (2,0)；（3）C(1,4)。", "steps": ["B(0,3) 给出 c＝3；A(3,0) 给出 −9＋3b＋3＝0，得 b＝2。", "AB 为 y＝−x＋3。设 P(p,0)，非退化要求 0＜p＜3。D(p,3−p)，C(p,−p²＋2p＋3)。", "PD＝3−p，CD＝p(3−p)。两三角形以 PD、CD 为底，从 B 到这两个底所在直线的高都为 p。", "因此 S△CDB/S△PDB＝CD/PD＝p。一者为另一者 2 倍，得 p＝2 或 1/2。", "第（3）问，△APC 为直角三角形；四点共圆时，圆心 M 为 AC 中点，坐标 ((p＋3)/2,(−p²＋2p＋3)/2)。", "圆还经过 A、B，M 在 AB 中垂线 y＝x 上。因此 p＋3＝−p²＋2p＋3，得 p(p−1)＝0。", "p＝0 时 C＝B，三角形退化，舍去。p＝1 时，C(1,4)。"], "hints": ["面积比较可以先看同高关系。", "四点共圆时，哪一个直角三角形能直接确定直径？"], "options": null, "correct": null, "source": "资料·变式 9-2；明确非退化条件，整理同高法", "fig": {"type": "parabola", "family": "vertical"}, "core": true}, {"id": "9p3", "title": "变式 9-3 · 外心运动会折返", "text": "抛物线 y＝x²＋bx＋c 经过原点 O，对称轴为 x＝2，顶点为 A。P 从 A 出发，沿对称轴每秒向上移动 1 个单位，t＞0；射线 OP 与抛物线另一交点为 B。<br>（1）求抛物线表达式。<br>（2）△AOB 为直角三角形时，求 t。<br>（3）M 为 △AOB 外心，求 1≤t≤5 时 M 经过的路径长度。", "answer": "（1）y＝x²−4x；（2）t＝1、2 或 5；（3）5√5/4。", "steps": ["经过原点得 c＝0，对称轴 −b/2＝2 得 b＝−4。所以 y＝x²−4x＝(x−2)²−4，A(2,−4)。", "P(2,t−4)。设 B(a,a²−4a)，由 t＞0 得 a＞2。OB 的表达式为 y＝(a−4)x，代入 P 得 t＝2a−4。", "三边平方：OA²＝20；OB²＝a²＋(a²−4a)²；AB²＝(a−2)²＋(a−2)⁴。", "直角在 A：OB²＝OA²＋AB²，化简为 −4(a−2)(2a−5)＝0。由 a＞2，得 a＝5/2，t＝1。", "直角在 O：AB²＝OA²＋OB²，化简为 4a(2a−9)＝0，得 a＝9/2，t＝5。", "直角在 B：OA²＝AB²＋OB²，化简为 −2a(a−3)²(a−2)＝0，得 a＝3，t＝2。三种情况合并为 1、2、5。", "设外心 M(u,v)。MO²＝MA² 给出 u＝2v＋5。MO²＝MB² 化简为 2u＋2v(a−4)＝a[1＋(a−4)²]。", "代入并整理，2v(a−2)＝(a−2)(a²−6a＋5)。a＞2，可约去 a−2，得 v＝[(a−3)²−4]/2，u＝(a−3)²＋1。", "t 从 1 到 5 时，a 从 5/2 到 9/2。(a−3)² 先减小到 0，再增大，转折在 a＝3、t＝2。因此外心不是一直向一个方向走。", "t＝1 时 M₁(5/4,−15/8)，t＝2 时 M₂(1,−2)，t＝5 时 M₃(13/4,−7/8)。", "M₁M₂＝√[(1/4)²＋(1/8)²]＝√5/8；M₂M₃＝√[(9/4)²＋(9/8)²]＝9√5/8。", "路径长度为两段之和，等于 5√5/4，不是起终点之间的直线距离。"], "hints": ["直角可能在三个顶点，不能只讨论一个。", "先把外心限制在固定直线上，再判断中途是否折返。"], "options": null, "correct": null, "source": "资料·变式 9-3；补充外心表达式及折返证明", "fig": {"type": "parabola", "family": "moving"}, "core": false}, {"id": "9p4", "title": "补充 1 · 圆心确定后检验顶点", "text": "y＝x²−4x＋3 与 x 轴交于 A、B，与 y 轴交于 C。求 △ABC 外心和外接圆半径，再判断抛物线顶点 V 的位置。", "answer": "外心 (2,2)，半径 √5，V 在圆外。", "steps": ["y＝(x−1)(x−3)，得 A(1,0)、B(3,0)、C(0,3)。", "外心在 x＝2 上，设 M(2,k)。MA²＝1＋k²，MC²＝4＋(k−3)²。", "等距得 1＝13−6k，所以 k＝2，M(2,2)，半径 √5。", "配方得顶点 V(2,−1)。MV＝3，MV²＝9＞5，故 V 在圆外。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主补充", "fig": {"type": "parabola", "family": "extra"}, "core": false}, {"id": "9p5", "title": "补充 2 · 外心在坐标轴上", "text": "y＝x²−2x＋k 与 x 轴交于两个不同点 A、B，与 y 轴交于 C。若 △ABC 外心位于 x 轴上，求 k 与半径。", "answer": "k＝−1，半径 √2。", "steps": ["配方 y＝(x−1)²＋k−1。两个不同交点要求 k＜1，其横坐标为 1±√(1−k)。", "AB 中垂线为 x＝1，外心又在 x 轴上，因此 M(1,0)。", "MA²＝1−k，而 C(0,k)，MC²＝1＋k²。", "由等距得 1−k＝1＋k²，即 k(k＋1)＝0。", "k＝0 时 C 与 A 重合，不能构成三角形，舍去。", "k＝−1 时三点互异且不共线，半径平方为 2，故半径 √2。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主补充", "fig": {"type": "parabola", "family": "parameter"}, "core": false}], "lab": "parabola"}], "exit": [{"id": "x1", "title": "离堂检测 1 · 比较距离", "text": "⊙O 的半径为 5，OP²＝26。判断 P 的位置，并写出比较式。", "answer": "圆外；26＞25。", "steps": ["r²＝25。", "OP²＝26＞25，故 OP＞r，P 在圆外。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主检测", "fig": null, "core": true}, {"id": "x2", "title": "离堂检测 2 · 等号是否包含", "text": "OA＝4、OB＝7。以 O 为圆心作圆，使 A 在圆内、B 不在圆内，求半径范围。", "answer": "4＜r≤7。", "steps": ["A 在圆内，r＞4。", "B 不在圆内，r≤7。", "合并得 4＜r≤7。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主检测", "fig": null, "core": true}, {"id": "x3", "title": "离堂检测 3 · 坐标中的外心", "text": "A(0,0)、B(6,0)、C(0,8)，求外心和外接圆半径。", "answer": "外心 (3,4)，半径 5。", "steps": ["AB 水平、AC 竖直，∠A＝90°。", "外心是斜边 BC 中点，坐标 (3,4)。", "BC＝√(6²＋8²)＝10，半径为 5。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主检测", "fig": {"type": "grid", "points": [[0, 0, "A"], [6, 0, "B"], [0, 8, "C"]]}, "core": true}, {"id": "x4", "title": "离堂检测 4 · 周长与面积", "text": "将大圆直径平均分成 3 段，分别以每段为直径作小圆。小圆周长和、面积和分别是大圆的多少？", "answer": "周长和等于大圆周长；面积和是大圆面积的 1/3。", "steps": ["每个小圆半径是大圆的 1/3，周长是 1/3，面积是 1/9。", "三个小圆周长和为 1 倍，面积和为 3×1/9＝1/3。"], "hints": ["先把已知量和所求量分别标在草图上。", "把位置或等距关系写成比较式、等式，再计算。"], "options": null, "correct": null, "source": "自主检测", "fig": {"type": "split", "n": 3}, "core": true}]}</script><script>
const PI=Math.PI, TAU=2*Math.PI;
const xml=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(x,n=2)=>Math.abs(x)<1e-9?"0":Number(x.toFixed(n)).toString();
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
function center3(a,b,c){let d=2*(a[0]*(b[1]-c[1])+b[0]*(c[1]-a[1])+c[0]*(a[1]-b[1]));if(Math.abs(d)<1e-10)return null;let z=p=>p[0]*p[0]+p[1]*p[1];return[(z(a)*(b[1]-c[1])+z(b)*(c[1]-a[1])+z(c)*(a[1]-b[1]))/d,(z(a)*(c[0]-b[0])+z(b)*(a[0]-c[0])+z(c)*(b[0]-a[0]))/d]}
function reflect(p,a,b){let x=b[0]-a[0],y=b[1]-a[1],d=x*x+y*y;if(d<1e-12)return[...p];let t=((p[0]-a[0])*x+(p[1]-a[1])*y)/d;return[2*(a[0]+t*x)-p[0],2*(a[1]+t*y)-p[1]]}
function boundsOf(pts,circles=[]){let p=pts.map(x=>[x[0],x[1]]);for(let [c,r]of circles)p.push([c[0]-r,c[1]-r],[c[0]+r,c[1]+r]);let xs=p.map(v=>v[0]),ys=p.map(v=>v[1]);let a=Math.min(...xs),b=Math.max(...xs),c=Math.min(...ys),d=Math.max(...ys);if(b-a<1){a-=.5;b+=.5}if(d-c<1){c-=.5;d+=.5}let px=(b-a)*.11,py=(d-c)*.13;return[a-px,b+px,c-py,d+py]}
class Geo{
 constructor(bounds=[-5,5,-4,4],w=480,h=300){this.w=w;this.h=h;this.b=bounds;this.s=Math.min((w-58)/(bounds[1]-bounds[0]),(h-52)/(bounds[3]-bounds[2]));this.cx=(bounds[0]+bounds[1])/2;this.cy=(bounds[2]+bounds[3])/2;this.parts=[];this.green="#285c46";this.gold="#b17c40";this.grey="#8d9a87";}
 xy(p){return[this.w/2+(p[0]-this.cx)*this.s,this.h/2-(p[1]-this.cy)*this.s]}
 inv(x,y){return[(x-this.w/2)/this.s+this.cx,(this.h/2-y)/this.s+this.cy]}
 line(a,b,color=this.green,width=1.7,dash=""){let p=this.xy(a),q=this.xy(b);this.parts.push(`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="${color}" stroke-width="${width}" ${dash?`stroke-dasharray="${dash}"`:""}/>`);return this}
 path(pts,color=this.green,width=1.7,dash="",fill="none",close=false){if(!pts.length)return this;let d=pts.map((p,i)=>{let v=this.xy(p);return`${i?"L":"M"}${v[0]},${v[1]}`}).join(" ")+(close?"Z":"");this.parts.push(`<path d="${d}" fill="${fill}" stroke="${color}" stroke-width="${width}" ${dash?`stroke-dasharray="${dash}"`:""} stroke-linejoin="round" stroke-linecap="round"/>`);return this}
 poly(pts,color=this.green,fill="#dbe8d53f"){return this.path(pts,color,1.8,"",fill,true)}
 circle(c,r,color=this.green,width=1.7,dash="",fill="none"){let v=this.xy(c);this.parts.push(`<circle cx="${v[0]}" cy="${v[1]}" r="${Math.abs(r*this.s)}" stroke="${color}" stroke-width="${width}" fill="${fill}" ${dash?`stroke-dasharray="${dash}"`:""}/>`);return this}
 text(p,t,dx=7,dy=-8,size=12,color=this.green,anchor="start"){let v=this.xy(p);this.parts.push(`<text x="${v[0]+dx}" y="${v[1]+dy}" font-size="${size}" fill="${color}" text-anchor="${anchor}">${xml(t)}</text>`);return this}
 rawtext(x,y,t,size=12,color=this.green,anchor="start"){this.parts.push(`<text x="${x}" y="${y}" font-size="${size}" fill="${color}" text-anchor="${anchor}">${xml(t)}</text>`);return this}
 dot(p,name="",dx=7,dy=-8,color=this.green,r=3.2,attrs=""){let v=this.xy(p);this.parts.push(`<circle cx="${v[0]}" cy="${v[1]}" r="${r}" fill="${color}" ${attrs}/>`);if(name)this.text(p,name,dx,dy,12,color);return this}

function showSolution(card,q,n=1){

 ${n===q.steps.length?`<div class="answer">结论：${q.answer}</div>${q.fig?geometry(q,true):""}<div class="selfcheck"><span>对照后给自己一个判断：</span><button data-action="done">能独立完成</button><button data-action="review">还需要再练</button></div>`:'<div class="q-actions"><button class="primary" data-action="next">下一步</button><button data-action="all">展开完整解析</button></div>'}<div class="q-actions"><button data-action="hide">收起讲解，再做一次</button></div>`;

function qAction(card,action){
 let q=QMAP[card.dataset.qid],e=entry(q.id);
 if(action==="check"){
  let feed=card.querySelector(".q-feedback");if(e.selected===null||e.selected===undefined){feed.className="q-feedback";feed.textContent="请先选择一个答案，再检查。";return}
  let yes=e.selected===q.correct;card.querySelectorAll(".opt").forEach(b=>{b.classList.remove("correct","wrong");if(Number(b.dataset.option)===e.selected)b.classList.add(yes?"correct":"wrong")});feed.className="q-feedback "+(yes?"":"wrong");feed.textContent=yes?"选择正确。请再确认：你的理由是否也完整？":"这一次还不正确。先检查定义或边界条件，再试一次。";e.status=yes?"done":"review";save();
 }else if(action==="hint"){let n=Math.min((Number(card.dataset.hints)||0)+1,q.hints.length);card.dataset.hints=n;let box=card.querySelector(".hint-box");box.hidden=false;box.innerHTML=q.hints.slice(0,n).map((x,i)=>`<p><b>提示 ${i+1}</b>　${x}</p>`).join("");card.querySelector('[data-action="hint"]').textContent=n===q.hints.length?"提示已全部展开":"再给一点提示";
 }else if(action==="show")showSolution(card,q,Number(card.dataset.steps)||1);
 else if(action==="next")showSolution(card,q,(Number(card.dataset.steps)||1)+1);
 else if(action==="all")showSolution(card,q,q.steps.length);
 else if(action==="hide"){card.querySelector(".solution").hidden=true;delete card.dataset.steps;card.querySelector('[data-action="show"]').textContent="分步看讲解"}
 else if(action==="done"){e.status="done";save();toast("已记录为“已掌握”。隔一段时间再独立做一次。")}
 else if(action==="review"){e.status="review";save();toast("已加入待复习，可在学习记录中找到。")}
}

</script><script>
function initLab(name,id){
 const mount=document.getElementById("labMount");if(!mount)return;

 function setPanel(){

  }

  if(name==="motion"){
   h=tabs([["crank","连杆与轨道"],["fold","受限制的折叠"]]);
   h+=s.mode==="crank"?`<p class="lab-intro">OA＝80，OQ＝35，PQ＝135。转动曲柄，观察轨道右侧滑块 P 的位置。</p>${range("theta","曲柄角度（度）",0,360,1,s.theta*180/PI)}<div class="lab-actions">${btn("animate",s.play?"暂停运动":"播放运动","primary")}${btn("show","显示当前距离")}${btn("min","检验最小位置")}${btn("max","检验最大位置")}</div>${msg}<p class="lab-hint">一周内往返一次。滑动路程与首尾位置之间的距离不同。</p>`:`<p class="lab-intro">AB＝8，AD＝6，E 是 AD 中点。F 只能在 AB 上移动，A 关于 EF 对称到 G。</p>${range("t","AF 的长度",0,8,.02,s.t)}<div class="lab-actions">${btn("show","显示当前距离","primary")}${btn("min","检验最近位置")}${btn("max","检验 F＝A")}</div>${msg}<p class="lab-hint">深色弧为 G 的可达范围；淡色虚线是整个圆。整圆上的最远点，不一定能到达。</p>`;
  }

   h+=s.mode==="family"?`<p class="lab-intro">y＝−x²＋(m−1)x＋m，m＞1。改变 m，观察面积差。图形观察用于提出猜想，结论仍需代数证明。</p>${range("m","参数 m",1.2,6,.1,s.m)}<div class="lab-actions">${btn("show","显示外心与面积","primary")}</div>${msg}`:`<p class="lab-intro">y＝x²−4x。P 从顶点向上运动，B 是射线 OP 与抛物线的另一交点。跟踪 △AOB 的外心 M。</p>${range("pathT","时间 t（秒）",1,5,.02,s.pathT)}<div class="lab-actions">${btn("animate",s.play?"暂停运动":"播放 1→5 秒","primary")}${btn("t1","t＝1")}${btn("t2","t＝2")}${btn("t5","t＝5")}${btn("show","显示坐标与路程")}</div>${msg}<p class="lab-hint">留意 M 是否始终朝同一方向移动。原题的时间范围为 1≤t≤5。</p>`;

 function message(text,waiting=false){let e=panel.querySelector("#labMsg");if(e){e.innerHTML=text;e.className="lab-message"+(waiting?" waiting":"")}}
 function setOut(k,v){let out=panel.querySelector(`[data-out="${k}"]`);if(out)out.textContent=fmt(v);}
 function controlVal(k,v){let e=panel.querySelector(`[data-param="${k}"]`);if(e)e.value=v;setOut(k,v)}
 function arcCompass(g,a,b,color){
  let l=dist(a,b),rr=l*.68,m=mid(a,b),u=[-(b[1]-a[1])/l,(b[0]-a[0])/l],h=Math.sqrt(rr*rr-l*l/4),p=[m[0]+h*u[0],m[1]+h*u[1]],q=[m[0]-h*u[0],m[1]-h*u[1]];
  for(let x of [p,q])for(let c of [a,b]){let t=Math.atan2(x[1]-c[1],x[0]-c[0]);g.arc(c,rr,t-.24,t+.24,color,1)}
  let ext=1.7;g.line([m[0]-u[0]*h*ext,m[1]-u[1]*h*ext],[m[0]+u[0]*h*ext,m[1]+u[1]*h*ext],color,1.25,"5 3");
 }
 function draw(){
  if(destroyed)return;let g;
  if(name==="point"){
   g=new Geo([-7.5,7.5,-6.5,6.5]);let p=[s.d*Math.cos(s.angle),s.d*Math.sin(s.angle)];
   g.circle([0,0],s.r,"#6e916d",1.8,"","#e2ecd943").line([0,0],[s.r,0],"#8a9e7f",1.2).line([0,0],p,g.gold,2).dot([0,0],"O",-15,16).dot(p,"P",9,-11,g.gold,7,'class="drag" data-drag="p"');
   g.text([s.r/2,0],"r＝"+fmt(s.r),0,19,12,g.green,"middle");g.rawtext(19,22,"OP＝"+fmt(s.d),12);setOut("r",s.r);setOut("d",s.d);
   if(s.reveal){let d=s.d-s.r;message(`OP＝${fmt(s.d)}，r＝${fmt(s.r)}。<br><b>${Math.abs(d)<1e-8?"OP＝r，P 在圆上。":d<0?"OP＜r，P 在圆内。":"OP＞r，P 在圆外。"}</b>`)}else message("先比较 OP 与 r，再点击“检验位置”。",true);
  }

   g=new Geo([-3.9,3.9,-3.9,3.9]);let x=Math.sqrt(9-s.y*s.y),a=[-x,s.y],b=[x,s.y];

   g.text(mid([0,0],b),"r＝3",9,6,11,g.gold);setOut("y",s.y);if(s.reveal)message(`弦长 AB≈${fmt(2*x,3)}。<br>${Math.abs(s.y)<1e-8?"此时经过圆心，AB 是直径，长度为 6，达到最大。":"还没有经过圆心。由勾股定理，半弦长的平方为 9−("+fmt(s.y)+")²，弦长小于 6。"} `);else message("哪一个位置的弦最长？先移动弦，再检验。",true)
  }
  if(name==="split"){
   if(s.mode==="split"){g=new Geo([-6.8,6.8,-6.5,6.5]);g.circle([0,0],6,"#8ea57d",1.5).line([-6,0],[6,0],"#a7b39d",1);for(let i=0;i<s.n;i++)g.circle([-6+(i+.5)*12/s.n,0],6/s.n,g.green,1.6,"","#cfdfc656");g.dot([-6,0],"A",-14,17).dot([6,0],"B",8,17);g.rawtext(18,21,`大圆半径 6　　n＝${s.n}`,12);setOut("n",s.n);
    if(s.reveal)message(`每个小圆半径为 6/${s.n}。<br>周长和：${s.n}×2π×(6/${s.n})＝<b>12π</b>，与大圆相等。<br>面积和：${s.n}×π×(6/${s.n})²＝<b>36π/${s.n}</b>，是大圆面积的 1/${s.n}。`);else message("周长和与面积和，会有相同的变化规律吗？",true);
   }else{
    let n=s.sectors||16,R=2.5,half=PI/n,delta=TAU/n,ww=2*R*Math.sin(half),hh=R*Math.cos(half),p=s.spread;g=new Geo([-4.9,4.9,-3.4,3.4]);
    for(let i=0;i<n;i++){let start=i*delta+half,target=i%2===0?PI/2:3*PI/2,turn=((target-start+3*PI)%TAU)-PI,ang=start+p*turn,c=[p*(i*ww/2-(n-1)*ww/4),p*(i%2===0?-hh/2:hh/2)],poly=[c];for(let k=0;k<=12;k++){let t=ang-half+2*half*k/12;poly.push([c[0]+R*Math.cos(t),c[1]+R*Math.sin(t)])}g.path(poly,i%2?"#8b9d70":"#4f7959",.7,"",i%2?"#e4d9b8":"#bdd3b0",true)}
    g.rawtext(19,21,`等分为 ${n} 份`,11);
    if(p>.98){g.rawtext(239,258,"底逐渐接近 πr",12,g.green,"middle");g.rawtext(432,150,"高约 r",11,g.green,"end");message("半个圆周约为拼补图形的底：C/2＝πr。<br>高约为 r，因此圆面积为 <b>πr²</b>。<br>增加份数，观察边缘如何变平。")}else message("先预测拼补后的底和高，再播放动画。",true);
   }
  }
  if(name==="radius"){
   let p=[[0,0],[6,0],[6,8],[0,8]];g=new Geo([-2,12,-2,11]);g.circle([0,0],s.r,"#92a87e",1.7,"","#e8eedf35").poly(p).line(p[0],p[2],g.gold,1.2,"4 3");p.forEach((v,i)=>g.dot(v,"ABCD"[i],i===0||i===3?-14:7,i<2?17:-8));g.text([3,0],"6",0,20,12,g.green,"middle").text([0,4],"8",-16,0,12,g.green,"end");g.rawtext(19,20,"r＝"+fmt(s.r),12);setOut("r",s.r);
   if(s.reveal){let loc=d=>Math.abs(d-s.r)<1e-9?"圆上":d<s.r?"圆内":"圆外";message(`AB＝6，AD＝8，AC＝10。<br><b>B：${loc(6)}　D：${loc(8)}　C：${loc(10)}</b><br>${s.r>6&&s.r<10?"当前既有点在圆内，也有点在圆外。":"当前不满足“至少一点在内、至少一点在外”。"}`)}else message("先求 AC，再预测 B、C、D 的位置。",true)

   let z=dist(a,b)**2+dist(a,c)**2-dist(b,c)**2,typ=Math.abs(z)<1e-7?"直角":z>0?"锐角":"钝角",place=typ==="锐角"?"三角形内部":typ==="直角"?"斜边中点":"三角形外部";
   let words=["先预测外心可能在哪里。","以 A、B 为圆心作等半径交弧，连接两个交点，得到 AB 的垂直平分线。","同法作 BC 的垂直平分线。两条垂直平分线交于一个点。","把交点记为 O，连接 OA、OB、OC。由垂直平分线性质，OA＝OB＝OC。","以 O 为圆心、OA 为半径作圆。三个顶点都在这个圆上。"];
   message(`第 ${s.stage} 步 / 4　${words[s.stage]}${s.stage>=3?`<br><b>当前为${typ}三角形，外心在${place}。</b>`:""}`,s.stage===0);

  }

   if(s.helpers)g.line([2,-3],[2,6],"#9a854e",1.4,"5 3").line([-1,-3],[8,6],"#688961",1.4,"5 3");
   if(s.reveal){let aa=dist(m,a)**2,bb=dist(m,b)**2,cc=dist(m,c)**2;message(`MA²＝${fmt(aa)}，MB²＝${fmt(bb)}，MC²＝${fmt(cc)}。<br><b>${Math.abs(aa-bb)<1e-7&&Math.abs(bb-cc)<1e-7?"三个距离相等，当前的 M 就是圆心。":"三个距离还不全相等，调整候选点再试。"}</b>`)}else message("圆心必须到 A、B、C 三点等距。",true)
  }
  if(name==="right"){
   let a=[s.a,0],b=[0,s.b],c=[0,0],d=[s.a,s.b],o=mid(a,b),r=dist(o,a);g=new Geo(boundsOf([a,b,c,d],s.stage>=3?[[o,r]]:[]));if(s.stage>=1)g.poly([c,a,d,b],"#9db18d","#e3e9d53b");g.poly([a,b,c]);if(s.stage>=2)g.line(c,d,g.gold,1.3,"4 3").line(a,b,g.gold,1.5).dot(o,"O",8,17);if(s.stage>=3)g.circle(o,r,"#739266",1.6);[[a,"A"],[b,"B"],[c,"C"]].forEach(([p,n])=>g.dot(p,n,n==="C"||n==="B"?-15:8,n==="A"||n==="C"?18:-8));if(s.stage>=1)g.dot(d,"D",8,-8);g.right(c,a,b).text(mid(a,c),fmt(s.a),0,20,12,g.green,"middle").text(mid(b,c),fmt(s.b),-15,0,12,g.green,"end");setOut("a",s.a);setOut("b",s.b);
   let txt=["先想一想：怎样补出一个以 AB 为对角线的矩形？","补成矩形 CADB。矩形有两条相等的对角线 AB、CD。","画出两条对角线，交于 O。它们互相平分，所以 OA＝OB＝OC＝OD。",`O 到三个顶点等距，是外心。<br>AB＝√(${fmt(s.a)}²＋${fmt(s.b)}²)≈${fmt(r*2)}，<b>R＝AB/2≈${fmt(r)}</b>。`];message(txt[s.stage],s.stage===0);
  }
  if(name==="motion"){
   if(s.mode==="crank"){
    let o=[0,80],q=[35*Math.cos(s.theta),80+35*Math.sin(s.theta)],p=[q[0]+Math.sqrt(135**2-q[1]**2),0],m=[20*Math.cos(s.theta),80+20*Math.sin(s.theta)];g=new Geo([-44,185,-17,126]);
    g.circle(o,35,"#b5c0a6",1,"4 5").circle(o,20,"#89a577",1.6,"","#d9e4cf48").line([0,0],[175,0],"#93a588",2.8).line([0,0],o,"#83967d",1.2,"5 4").line(o,q,g.green,3.4).line(q,p,g.gold,3.2).right([0,0],o,p);
    let pv=g.xy(p);g.parts.push(`<rect x="${pv[0]-11}" y="${pv[1]-7}" width="22" height="14" rx="3" fill="#dce7d4" stroke="#537d53" stroke-width="1.4"/>`);
    [[o,"O"],[q,"Q"],[m,"M"],[p,"P"],[[0,0],"A"]].forEach(([v,n])=>g.dot(v,n,n==="M"?-15:7,n==="P"||n==="A"?19:-8));g.text([0,40],"80",-12,0,12,g.green,"end").text(mid(q,p),"135",0,-9,12,g.gold);g.rawtext(18,20,"OM＝20，MQ＝15",11);controlVal("theta",(s.theta*180/PI+360)%360);
    if(s.reveal)message(`当前 AP≈<b>${fmt(p[0])}</b>，OP≈${fmt(dist([0,80],p))}。<br>由 AP²＝OP²−80² 求轨道上的位置。<br>比较两端位置时，别把 OP 当成滑动长度。`);else message("先观察 P 的运动范围，再检验两个端点。",true);
   }else{
    let a=[0,0],b=[8,0],c=[8,6],d=[0,6],e=[0,3],f=[s.t,0],gg=reflect(a,e,f),end=reflect(a,e,[8,0]),angle=Math.atan2(end[1]-3,end[0]);g=new Geo([-4,10,-1,7]);
    g.circle(e,3,"#b2bfa5",1.1,"4 4").arc(e,3,-PI/2,angle,"#46784a",2.5).poly([a,b,c,d],"#536f4d","#eef1e238").line(e,f,g.gold,2).line(a,f,"#809976",2).line(e,gg,g.green,1.2,"4 3").line(c,gg,g.gold,1.6).line(c,e,"#9daa8b",1.1,"4 3");
    [[a,"A"],[b,"B"],[c,"C"],[d,"D"],[e,"E"],[f,"F"],[gg,"G"]].forEach(([v,n])=>g.dot(v,n,n==="D"||n==="E"?-16:7,n==="A"||n==="B"||n==="F"?19:-8,n==="G"?g.gold:g.green,n==="G"?5:3));g.rawtext(18,21,"深色实线：可达弧　淡色虚线：整个圆",10);controlVal("t",s.t);
    if(s.reveal)message(`AF≈${fmt(s.t)}，EG＝3，当前 CG≈<b>${fmt(dist(c,gg),3)}</b>。<br>${s.t<1e-8?"F＝A 时，G＝A，CG＝10。":Math.abs(s.t-3*(Math.sqrt(73)+3)/8)<1e-6?"此时 G 在线段 EC 上，CG＝√73−3。":"G 只能在可达弧上运动，不能把整圆最值直接套用。"}<br>最大值的上界证明见变式 8-3。`);else message("整个圆上的最远点，在这段可达弧上吗？",true);
   }
  }
  if(name==="parabola"){
   if(s.mode==="family"){
    let m=s.m,a=[-1,0],b=[m,0],c=[0,m],d=[(m-1)/2,(m-1)/2],r=Math.sqrt((m*m+1)/2),peak=(m+1)**2/4,low=s.reveal?Math.min(-1.2,d[1]-r-.5):-1.2;g=new Geo([-2,m+1,low,Math.max(m,peak)+1]);g.grid();let curve=[];for(let i=0;i<=180;i++){let x=-1.6+(m+2.2)*i/180,y=-x*x+(m-1)*x+m;if(y>=g.b[2]&&y<=g.b[3])curve.push([x,y])}g.path(curve,"#77916b",1.8).poly([a,b,c]);
    if(s.reveal){g.circle(d,r,"#a1b18d",1.15,"4 3").poly([a,c,d],"#698966","#c5ddbc75").poly([a,b,d],g.gold,"#e4cda36b").dot(d,"D",8,16,g.gold)}
    [[a,"A"],[b,"B"],[c,"C"]].forEach(([p,n])=>g.dot(p,n,n==="A"?-15:7,n==="C"?-10:17));setOut("m",s.m);
    if(s.reveal)message(`D(${fmt(d[0])},${fmt(d[1])})。<br>S₁＝(m²＋1)/4＝${fmt((m*m+1)/4,3)}<br>S₂＝(m²−1)/4＝${fmt((m*m-1)/4,3)}<br><b>S₁−S₂＝0.5</b><br>改变 m，观察后再用典例中的式子证明。`);else message("先预测：m 改变时，两个面积的差会怎样变化？",true);
   }else{
    let t=s.pathT,a=2+t/2,A=[2,-4],O=[0,0],B=[a,a*a-4*a],P=[2,t-4],z=(a-3)**2,M=[1+z,-2+z/2],m1=[1.25,-1.875],m2=[1,-2],m3=[3.25,-.875];g=new Geo([-1.5,7,-5.4,3.5]);g.grid();let p=[];for(let i=0;i<=150;i++){let x=-.3+4.95*i/150,y=x*x-4*x;if(y>=-5.4&&y<=3.5)p.push([x,y])}g.path(p,"#9aa988",1.5).line([2,-5],[2,3],"#b3bda8",1,"4 3").poly([A,O,B],"#587c50","#dce6cf3b").line(O,B,g.gold,1.5).line(m2,m3,"#698b5a",2.3,"4 3");
    g.circle(M,dist(M,O),"#adba9e",1.1,"4 4").line(m1,t<=2?M:m2,g.gold,3);if(t>2)g.line(m2,M,g.green,3);
    [[A,"A"],[O,"O"],[B,"B"],[P,"P"],[M,"M"]].forEach(([v,n])=>g.dot(v,n,n==="A"?-14:7,n==="A"?17:-8,n==="M"?g.gold:g.green,n==="M"?5:3));
    if(s.reveal){g.dot(m1,"t＝1",-10,-14,"#b28449",2.4).dot(m2,"t＝2",-8,24,"#638a57",2.4).dot(m3,"t＝5",7,17,"#638a57",2.4)}
    controlVal("pathT",t);if(s.reveal){let traveled=Math.sqrt(5)/2*(t<=2?.25-z:.25+z);message(`t＝${fmt(t)}，M(${fmt(M[0],3)},${fmt(M[1],3)})。<br>从 t＝1 起累计路程≈${fmt(traveled,3)}。<br><b>t＝2 时折返；总路程是两段长度之和。</b><br>t＝5 时为 5√5/4≈${fmt(5*Math.sqrt(5)/4,3)}。`)}else message("拖动时间滑块，观察 M 到 t＝2 前后是否改变方向。",true)
   }
  }
  lastGeo=g;if(g)canvas.innerHTML=g.svg(titles[name],'aria-describedby="labMsg"');
  let ab=panel.querySelector('[data-la="animate"]');if(ab)ab.textContent=s.play?"暂停运动":name==="parabola"?"播放 1→5 秒":"播放运动";
 }
 function stop(){s.play=false;cancelAnimationFrame(frame);frame=0;last=0}
 function animate(now){if(destroyed||!s.play)return;if(!last)last=now;let dt=Math.min(.05,(now-last)/1000);last=now;if(name==="motion")s.theta=(s.theta+dt*.72)%TAU;else{s.pathT=Math.min(5,s.pathT+dt*.55);if(s.pathT>=5)s.play=false}draw();if(s.play)frame=requestAnimationFrame(animate)}
 function areaMotion(target){cancelAnimationFrame(areaFrame);let start=s.spread,t0=performance.now();function tick(now){if(destroyed)return;let p=Math.min(1,(now-t0)/1150),e=p*p*(3-2*p);s.spread=start+(target-start)*e;draw();if(p<1)areaFrame=requestAnimationFrame(tick)}areaFrame=requestAnimationFrame(tick)}
 function act(a){
  if(["split","area","crank","fold","family","path"].includes(a)){stop();cancelAnimationFrame(areaFrame);s.mode=a;s.reveal=false;setPanel();draw();return}
  if(a==="show"||a==="check")s.reveal=true;
  if(a==="on"){s.d=s.r;controlVal("d",s.d);s.reveal=false}
  if(a==="diameter"){s.y=0;controlVal("y",0);s.reveal=false}
  if(["r6","r8","r10"].includes(a)){s.r=Number(a.slice(1));controlVal("r",s.r);s.reveal=false}
  if(a==="next"){s.stage=Math.min(name==="construct"?4:3,s.stage+1)}
  if(a==="prev")s.stage=Math.max(0,s.stage-1);
  if(a==="reset")s.stage=0;
  if(a==="helpers"){s.helpers=!s.helpers;let b=panel.querySelector('[data-la="helpers"]');b.textContent=s.helpers?"隐藏垂直平分线":"显示垂直平分线"}
  if(a==="show"&&name==="right")s.stage=3;
  if(a==="spread"){areaMotion(1);return}
  if(a==="gather"){areaMotion(0);return}
  if(a==="animate"){s.play=!s.play;cancelAnimationFrame(frame);last=0;if(s.play){if(name==="parabola"&&s.pathT>=5)s.pathT=1;frame=requestAnimationFrame(animate)}}
  if(a==="min"||a==="max"){stop();s.reveal=true;if(s.mode==="crank"){s.theta=a==="min"?Math.atan2(28,-21):(Math.atan2(-80,150)+TAU);controlVal("theta",s.theta*180/PI)}else{s.t=a==="min"?3*(Math.sqrt(73)+3)/8:0;controlVal("t",s.t)}}
  if(["t1","t2","t5"].includes(a)){stop();s.pathT=Number(a.slice(1));controlVal("pathT",s.pathT)}
  draw();
 }
 root.addEventListener("click",e=>{let b=e.target.closest("[data-la]");if(b)act(b.dataset.la)});
 root.addEventListener("input",e=>{
  let k=e.target.dataset.param;if(!k)return;stop();
  if(k==="tri"){s.tri=e.target.value;s.apex=s.tri==="acute"?[0,4.3]:s.tri==="right"?[0,3]:[0,1.6];s.stage=0}
  else if(k==="theta")s.theta=Number(e.target.value)*PI/180;
  else if(k==="sectors"){s.sectors=Number(e.target.value)}
  else{s[k]=Number(e.target.value);if(["gx","gy"].includes(k))s[k]=Math.max(k==="gx"?-1:-2,Math.min(k==="gx"?7:5,Math.round(s[k])))}
  if(!["m","pathT","theta","t","sectors","a","b"].includes(k))s.reveal=false;
  draw();
 });
 function coord(e){let svg=canvas.querySelector("svg"),p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;let matrix=svg.getScreenCTM();if(!matrix)return[0,0];let local=p.matrixTransform(matrix.inverse());return lastGeo.inv(local.x,local.y)}
 canvas.addEventListener("pointerdown",e=>{
  let target=e.target.closest("[data-drag]");if(target){dragging=target.dataset.drag;canvas.setPointerCapture(e.pointerId);e.preventDefault()}
  else if(name==="grid"){let p=coord(e);s.gx=Math.max(-1,Math.min(7,Math.round(p[0])));s.gy=Math.max(-2,Math.min(5,Math.round(p[1])));controlVal("gx",s.gx);controlVal("gy",s.gy);s.reveal=false;draw()}
 });
 canvas.addEventListener("pointermove",e=>{
  if(!dragging||!lastGeo)return;let p=coord(e);
  if(dragging==="p"){s.angle=Math.atan2(p[1],p[0]);s.d=Math.min(7,Math.hypot(...p));if(Math.abs(s.d-s.r)<.12)s.d=s.r;controlVal("d",s.d);s.reveal=false}
  if(dragging==="a"){s.apex=[Math.max(-2.8,Math.min(2.8,p[0])),Math.max(.8,Math.min(6,p[1]))]}
  draw();e.preventDefault();
 });
 const release=()=>dragging=null;canvas.addEventListener("pointerup",release);canvas.addEventListener("pointercancel",release);
 setPanel();draw();LAB_DESTROY=()=>{destroyed=true;stop();cancelAnimationFrame(areaFrame)};
}
